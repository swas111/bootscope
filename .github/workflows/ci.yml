name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Avoid piling up redundant runs on fast pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate: never let a secret land, independent of the build matrix.
  secret-check:
    name: Secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for secrets
        run: bash scripts/check-secrets.sh --all

  build:
    name: Build (JDK ${{ matrix.java }} on ${{ matrix.os }})
    needs: secret-check
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java: [ '17', '21' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Java 17 is the compile/release baseline for every module; newer JDKs
      # in the matrix only prove the build also runs on them.
      - name: Build and test
        run: mvn -B -ntp verify
